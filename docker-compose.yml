services:
  router:
    build: ./router
    ports:
      - "8000:8000"
    environment:
      - NEW_API_BASE=http://new-api:3000/v1
      - NEW_API_KEY=${NEW_API_KEY}
      - ARK_API_KEY=${ARK_API_KEY}
      - ARK_BASE_URL=${ARK_BASE_URL:-https://ark.cn-beijing.volces.com/api/v3}
      - KIMI_API_KEY=${KIMI_API_KEY}
      - KIMI_BASE_URL=${KIMI_BASE_URL:-https://api.moonshot.cn/v1}
      - MINIMAX_API_KEY=${MINIMAX_API_KEY}
      - MINIMAX_BASE_URL=${MINIMAX_BASE_URL:-https://api.minimax.chat/v1}
    volumes:
      - ./router/routing.yaml:/app/routing.yaml
    depends_on:
      - new-api
    restart: unless-stopped

  new-api:
    image: calciumion/new-api:v0.6.8
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./new-api/config:/data
    environment:
      - TZ=Asia/Shanghai
    restart: unless-stopped
